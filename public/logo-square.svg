<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Teal rounded background -->
  <rect width="240" height="240" rx="44" fill="#0d9488"/>

  <!-- Hanger hook -->
  <path d="M 120,90 C 120,66 134,50 152,48 C 170,46 181,61 175,76 C 169,89 155,92 140,90"
        fill="none" stroke="white" stroke-width="13" stroke-linecap="round"/>

  <!-- Left shoulder (slight bow outward) -->
  <path d="M 120,90 Q 74,112 32,185"
        fill="none" stroke="white" stroke-width="13" stroke-linecap="round"/>

  <!-- Right shoulder (slight bow outward) -->
  <path d="M 120,90 Q 166,112 208,185"
        fill="none" stroke="white" stroke-width="13" stroke-linecap="round"/>

  <!-- Crossbar -->
  <line x1="23" y1="185" x2="217" y2="185"
        stroke="white" stroke-width="13" stroke-linecap="round"/>

  <!-- Small price tag dangling from hanger center -->
  <line x1="120" y1="90" x2="120" y2="115"
        stroke="white" stroke-width="5" stroke-dasharray="3,3"/>
  <rect x="108" y="115" width="24" height="18" rx="3" fill="white"/>
  <circle cx="120" cy="115" r="3" fill="#0d9488"/>
</svg>
